    <style>
      /* Critical CSS inlined for instant first paint */
      *,*::before,*::after{box-sizing:border-box}html{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}body{margin:0;background:#f8fafc;min-height:100vh}#root{min-height:100vh}.skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.5rem 1rem;font-size:0.875rem;font-weight:600;border-radius:0.5rem;border:none;cursor:pointer;transition:all .15s}.btn-primary{background:#f59e0b;color:#fff}.btn-primary:hover{background:#d97706}.btn-secondary{background:#fff;color:#475569;border:1px solid #cbd5e1}.btn-secondary:hover{background:#f8fafc}.input{width:100%;padding:0.5rem 0.75rem;font-size:0.875rem;border:1px solid #cbd5e1;border-radius:0.5rem;outline:none;transition:border .15s,box-shadow .15s}.input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px #fef3c7}.card{background:#fff;border:1px solid #e2e8f0;border-radius:0.75rem;box-shadow:0 1px 3px 0 #0000001a}.table-container{overflow-x:auto;border:1px solid #e2e8f0;border-radius:0.75rem}table{width:100%;border-collapse:collapse;font-size:0.875rem}th,td{padding:0.75rem 1rem;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#f8fafc;font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:#64748b}tr:hover td{background:#f8fafc}.badge{display:inline-flex;align-items:center;padding:0.125rem 0.5rem;font-size:0.625rem;font-weight:600;border-radius:9999px;text-transform:uppercase}.badge-success{background:#dcfce7;color:#166534}.badge-warning{background:#fef3c7;color:#92400e}.badge-error{background:#fee2e2;color:#991b1b}.badge-info{background:#dbeafe;color:#1e40af}.badge-default{background:#f1f5f9;color:#475569}
    </style>
